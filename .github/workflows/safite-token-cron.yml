name: Auto-Renovar Token SAFITE (Multi-Usuario 24h)

on:
  schedule:
    # Se ejecuta cada 12 horas (a las 00:00 y 12:00 UTC -> 7:00 PM y 7:00 AM hora Colombia)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic desde la pestaña Actions en GitHub

jobs:
  renew-token:
    name: Renovación Headless Multi-Usuario
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias de Playwright
        run: |
          npm install playwright mysql2 dotenv
          npx playwright install --with-deps chrome chromium

      - name: Ejecutar Renovación Playwright
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_SSL: ${{ secrets.MYSQL_SSL || 'false' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SAFITE_LOGIN_URL: ${{ secrets.SAFITE_LOGIN_URL || 'https://app.safiteapp.com/login.html?nit=901599040-4&keyCompany=LVY7SMEezWqi7lO739SQcu6SoQtu819JU64ddFhBjY' }}
          SAFITE_NIT: ${{ secrets.SAFITE_NIT || '901599040-4' }}
          SAFITE_ID_EMPRESA: ${{ secrets.SAFITE_ID_EMPRESA || '1282' }}
        run: |
          node scripts/safite-auto-login.js

      - name: Subir Capturas en Caso de Error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safite-login-error-screenshots
          path: error-login-*.png
          retention-days: 3
