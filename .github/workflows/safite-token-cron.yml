name: Auto-Renovar Token SAFITE (Multi-Usuario 24h)

on:
  schedule:
    # Se ejecuta cada 12 horas (a las 00:00 y 12:00 UTC -> 7:00 PM y 7:00 AM hora Colombia)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic desde la pestaña Actions en GitHub

jobs:
  renew-token:
    name: Renovación Headless Multi-Usuario
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: safite-token-renewal
      cancel-in-progress: false

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias de Playwright
        run: |
          npm ci
          npx playwright-core install --with-deps chrome

      - name: Verificar secrets requeridos
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SAFITE_LOGIN_URL: ${{ secrets.SAFITE_LOGIN_URL }}
          SAFITE_ID_EMPRESA: ${{ secrets.SAFITE_ID_EMPRESA }}
        run: |
          missing=0
          for v in MYSQL_HOST MYSQL_USER MYSQL_PASSWORD MYSQL_DATABASE ENCRYPTION_KEY SAFITE_LOGIN_URL SAFITE_ID_EMPRESA; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret $v"; missing=1; fi
          done
          exit $missing

      - name: Ejecutar Renovación Playwright
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_SSL: ${{ secrets.MYSQL_SSL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SAFITE_LOGIN_URL: ${{ secrets.SAFITE_LOGIN_URL }}
          SAFITE_NIT: ${{ secrets.SAFITE_NIT }}
          SAFITE_ID_EMPRESA: ${{ secrets.SAFITE_ID_EMPRESA }}
        run: |
          node scripts/safite-auto-login.js --all

      - name: Subir Capturas en Caso de Error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safite-login-error-screenshots
          path: error-login-*.png
          retention-days: 3
